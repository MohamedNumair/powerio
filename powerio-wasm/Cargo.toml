[package]
name = "powerio-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "WebAssembly surface for powerio: the web WebEngine backend (parse/convert/summary/extract over wasm-bindgen)."
license.workspace = true
repository.workspace = true
publish = false

# cdylib produces the .wasm artifact for the web app; rlib keeps the crate
# unit-testable on the host. Build for the web with wasm-pack / the wasm32 target;
# this crate is intentionally NOT in the workspace `default-members`, so a bare
# `cargo build`/`test`/`clippy` never tries to compile it for the host's libc.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Path deps via the workspace table (carry the 0.3.0 pin). Pure-Rust, verified
# wasm-safe (plan §4, M2 entry gate #22): neither crate declares features, and
# their dependency closure is thiserror / num-complex / lexical-core / petgraph
# / serde(_json) — no arrow, no parquet, no rayon, no getrandom, no
# powerio-matrix. std::fs is never reached on the in-memory convert/parse path
# (only DSS Redirect/Compile includes touch it, and those degrade to a warning
# on wasm rather than failing).
powerio.workspace = true
powerio-dist.workspace = true
wasm-bindgen = "0.2"
# Derive-based marshalling of the JS DTOs ({text, warnings[]}, summary, tables)
# so the payloads map 1:1 to the Dart DTOs the desktop FFI backend returns.
serde = { workspace = true }
serde-wasm-bindgen = "0.6"

[lints]
workspace = true
